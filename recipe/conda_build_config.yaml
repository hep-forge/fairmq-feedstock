c_stdlib:
  - sysroot                    # [linux]
  - macosx_deployment_target   # [osx]

c_stdlib_version:              # [unix]
  - 2.17                       # [linux]
  - 11.0                       # [osx]

# ---- Compiler floor (ABI)
# Same floor as the rest of hep-forge (see jana-feedstock): pin the
# compiler major instead of inheriting conda-build's newest. 14 is the
# oldest major still current for both linux-64 and linux-aarch64, and
# defaults to gnu++17, which is what FairMQ requires.
c_compiler_version:    # [linux]
  - 14                       # [linux]
cxx_compiler_version:  # [linux]
  - 14                       # [linux]
libgcc_version:        # [linux]
  - 14.*                     # [linux]
libstdcxx_version:     # [linux]
  - 14.*                     # [linux]
# macOS: the clang ROOT is built with (root-feedstock pins 20).
c_compiler_version:    # [osx]
  - 20                         # [osx]
cxx_compiler_version:  # [osx]
  - 20                         # [osx]
